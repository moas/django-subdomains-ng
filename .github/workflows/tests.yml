name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.${{ matrix.python-minor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-minor: [10, 11, 12, 13, 14]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.${{ matrix.python-minor }}"
      - run: python -m pip install tox
      - run: python -m tox run -f py3${{ matrix.python-minor }}
