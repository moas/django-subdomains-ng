[tox]
env_list = py3{10,11,12,13,14}-django52, py3{12,13,14}-django{60,61}
          py310-django52min

[testenv]
deps =
    django52: Django>=5.2.8,<5.3
    django52min: Django==5.2
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands = python -m django test subdomains.tests --settings=subdomains.tests.settings
